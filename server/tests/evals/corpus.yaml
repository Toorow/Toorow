- id: grain_trap_gsc_average_position
  question: What is the overall average position for GSC in June 2026?
  as_of: '2026-07-15'
  surface: grain_trap
  difficulty: hard
  tags:
  - gsc
  - average_position
  - grain_trap
  - non_additive
  grain_trap_note: SUM(value) on metric='average_position' in fact_daily_kpi returns
    null because average_position is non-additive and NOT stored in fact_daily_kpi
    at all; the correct approach queries marts.semantic_avg_position and computes
    the impression-weighted mean SUM(average_position * impressions_weight) / NULLIF(SUM(impressions_weight),
    0) over the window — a single scalar
  expected_citations: []
  updated_at: '2026-07-21T00:00:00Z'
  reference_queries:
  - reference_sql: SELECT SUM(value) AS avg_position_WRONG FROM marts.fact_daily_kpi
      WHERE project_id = 'default' AND connector = 'gsc' AND metric = 'average_position'
      AND date BETWEEN '2026-06-01' AND '2026-06-30'
    expected_result_fixture: fixtures/grain_trap_gsc_average_position__naive_wrong.json
    fixture_sha256: 014bf9a439d00f2382742f26ebd4f037815d308d612ec86fc4199c263c20d91b
    role: naive_wrong
    note: Naive SUM against fact_daily_kpi returns one null row — avg_position not
      in this mart
  - reference_sql: SELECT ROUND(SUM(average_position * impressions_weight) / NULLIF(SUM(impressions_weight),
      0), 2) AS overall_avg_position FROM marts.semantic_avg_position WHERE project_id
      = 'default' AND connector = 'gsc' AND date BETWEEN '2026-06-01' AND '2026-06-30'
    expected_result_fixture: fixtures/grain_trap_gsc_average_position__canonical_correct.json
    fixture_sha256: 6266126194a385973f590493ff73c7ff70b967b5691ce83f4de149b9e17d903e
    role: canonical_correct
    note: 'Impression-weighted overall average position: SUM(average_position * impressions_weight)
      / NULLIF(SUM(impressions_weight), 0) — one scalar for June 2026, matching the
      grain_trap_note'
