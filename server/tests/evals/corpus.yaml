- id: grain_trap_cross_source_conversions_dedup
  question: Combien de conversions ai-je eu au total (toutes sources) sur juin 2026
    ?
  as_of: '2026-07-15'
  surface: grain_trap
  difficulty: hard
  tags:
  - cross-connector
  - conversions
  - grain_trap
  - dedup
  grain_trap_note: SUM(value) WHERE metric='conversions' across ALL connectors in
    fact_daily_kpi counts each conversion attributed by EVERY régie that claimed it
    — a user converting via GA4 and Meta Ads is counted twice; the canonical approach
    queries marts.cross_source_conversions, which applies Rule P priority deduplication
    to pick one winning connector per (project_id, date) and sum only that connector's
    conversions on its canonical breakdown dimension
  expected_citations: []
  updated_at: '2026-07-21T00:00:00Z'
  reference_queries:
  - reference_sql: SELECT SUM(value) AS conversions_WRONG FROM marts.fact_daily_kpi
      WHERE project_id = 'default' AND metric = 'conversions' AND date BETWEEN '2026-06-01'
      AND '2026-06-30'
    expected_result_fixture: fixtures/grain_trap_cross_source_conversions_dedup__naive_wrong.json
    fixture_sha256: a812b9fe8db1f27d4aee9004fe108463210979fdf98d763dd68de78c2fc44528
    role: naive_wrong
    note: Naive sum across ALL connectors and ALL breakdown dims — over-counts cross-régie
      attributions by N× the number of parallel series
  - reference_sql: SELECT SUM(conversions_total) AS total_deduped_conversions FROM
      marts.cross_source_conversions WHERE project_id = 'default' AND date BETWEEN
      '2026-06-01' AND '2026-06-30'
    expected_result_fixture: fixtures/grain_trap_cross_source_conversions_dedup__canonical_correct.json
    fixture_sha256: 9616a9b3c1a8f770f1cb2eaccc4afe26dc2c0c28f5038039e047bff6fa2ae4ae
    role: canonical_correct
    note: 'Rule P dedup via marts.cross_source_conversions: one winning connector
      per (project_id, date), summed over June 2026 — a real substantive number, strictly
      less than the naive total'
