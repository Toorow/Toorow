version: 2

sources:
  - name: raw_stripe
    description: "Immutable raw landing zone for Stripe payments (AD-7: append-only)."
    schema: main  # DuckDB default schema; BigQuery: override via profiles.yml dataset
    tables:
      - name: raw_stripe_payments
        description: >
          Raw Stripe charges — one row per charge × pull_id. Append-only (AD-7):
          each pull run adds a new batch identified by pull_id. Amounts are already in
          currency UNITS (converted from centimes by the connector at pull time --
          conversion EXPLICITE, jamais silencieuse). client_reference_id is a DETAIL
          dimension (GA4-joinable WHEN present, souvent absent -- AI-53).
        columns:
          - name: date
            description: "ISO-8601 date string (charge created day, UTC). Day grain."
          - name: charge_id
            description: "Stripe charge id. Supersede grain key with (project_id, date)."
          - name: payment_intent_id
            description: >
              PaymentIntent id (charge.payment_intent). Detail dimension / transaction
              identifier. Nullable. AI-53: shape to confirm live (string id vs expanded object).
          - name: client_reference_id
            description: >
              GA4-joinable id WHEN present. AI-53 (verifie 2026-07-19): champ de
              checkout.Session, PAS de Charge -- present UNIQUEMENT pour les paiements
              Stripe Checkout dont le marchand a rempli le champ (souvent absent). Aucune
              cle GA4 fiable universelle cote Stripe -> nullable, reconciliation Epic 17
              cote Stripe reste AGREGEE (pas au niveau transaction). Detail dimension, NOT a
              mart partition.
          - name: revenue
            description: >
              Charge amount in currency UNITS (converted from centimes at pull). AI-53:
              mapped from charge.amount. Additive (AD-4). DEDUP: revenue Stripe et revenue
              Shopify jamais sommes dans un total croise (cross_source_revenue, AD-4).
          - name: refunds
            description: >
              Refunded amount for the charge in currency units, DEDICATED positive column.
              AI-53: charge.amount_refunded. NEVER subtracted silently from revenue
              (decision de story 15.7, meme discipline que Shopify 15.4). Additive (AD-4).
          - name: fees
            description: >
              Stripe processing fee for the charge in currency units, DEDICATED positive
              column. AI-53: charge.balance_transaction.fee (via expand). NEVER subtracted
              silently from revenue. Additive (AD-4).
          - name: transaction_count
            description: "1 per charge; summed to a daily payment count in the mart. Additive (AD-4)."
          - name: order_count
            description: "1 per charge; summed to a daily order count in the mart. Additive (AD-4)."
          - name: revenue_source_currency
            description: "Charge currency (e.g. 'EUR', 'USD'). Enables FX normalization in staging."
          - name: pull_id
            description: "Prefixed ULID (pull_<ULID>) identifying the load batch. AD-7."
          - name: loaded_at
            description: "UTC ISO-8601 timestamp of when this batch was loaded."
          - name: project_id
            description: "Project binding. 'default' for seeded test data; real project IDs otherwise (AD-14)."

models:
  - name: stg_stripe_payments_daily
    description: >
      Staging layer: maps raw Stripe payment fields to canonical names. AD-4: only additive
      metrics (revenue, refunds, fees, transaction_count, order_count). Supersede semantics
      (AD-7): QUALIFY keeps the latest pull per (project_id, date, charge_id). Currency:
      revenue / refunds / fees are FX-normalized to the project canonical currency (EUR by
      default) via fx_rates; source values preserved. refunds and fees are DEDICATED positive
      columns (decision de story 15.7) — never netted into revenue. DEDUP: revenue Stripe and
      revenue Shopify never sum into a cross-source total (cross_source_revenue view).
    tests:
      # Grain uniqueness (AI-05): one row per project × date × charge.
      - unique:
          name: stg_stripe_payments_grain_unique
          arguments:
            column_name: "project_id || '|' || date || '|' || charge_id"
    columns:
      - name: date
        description: "ISO-8601 date string, charge created day (UTC)."
        tests:
          - not_null
      - name: charge_id
        description: "Stripe charge id (grain key with project_id + date)."
        tests:
          - not_null
      - name: payment_intent_id
        description: "PaymentIntent id (transaction identifier, detail dimension). Nullable."
      - name: client_reference_id
        description: >
          GA4-joinable id WHEN present (souvent absent -- AI-53). Nullable detail dimension.
      - name: revenue
        description: "Charge amount normalized to project currency (additive, AD-4)."
        tests:
          - not_null
      - name: refunds
        description: >
          Refund total normalized to project currency — DEDICATED positive column, never
          netted into revenue (decision de story 15.7). Additive (AD-4).
        tests:
          - not_null
      - name: fees
        description: >
          Stripe fee total normalized to project currency — DEDICATED positive column, never
          netted into revenue (decision de story 15.7). Additive (AD-4).
        tests:
          - not_null
      - name: transaction_count
        description: "1 per charge; summed to a daily payment count in the mart (additive, AD-4)."
        tests:
          - not_null
      - name: order_count
        description: "1 per charge; summed to a daily order count in the mart (additive, AD-4)."
        tests:
          - not_null
      - name: revenue_source_value
        description: "Raw charge amount in the charge currency (AD-6: preserved for reconciliation)."
        tests:
          - not_null
      - name: revenue_source_currency
        description: "The currency of the raw charge amount (e.g. 'EUR')."
        tests:
          - not_null
      - name: pull_id
        description: "Provenance ID from raw load batch (AD-7)."
        tests:
          - not_null
      - name: loaded_at
        description: "UTC load timestamp from raw batch."
      - name: project_id
        description: "Project binding propagated from raw_stripe_payments."
        tests:
          - not_null
