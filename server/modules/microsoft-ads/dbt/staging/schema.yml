version: 2

sources:
  - name: raw_microsoft_ads
    description: "Immutable raw landing zone for Microsoft Ads (Bing) v13 reporting data (AD-7: append-only)."
    schema: main  # DuckDB default schema; BigQuery: override via profiles.yml dataset
    tables:
      - name: raw_microsoft_ads_daily
        description: >
          Raw Microsoft Ads daily data, LONG format (Story 26.4): one row per
          grain x metric x pull_id. Append-only (AD-7): each pull run adds a
          new batch identified by pull_id. catalog_daily can land ANY of the
          192 cataloged columns of the 8 covered report types (metric,
          value_num), which is why the landing is long, not wide. Values are
          coerced by CATALOG physical_type at parse time (percent cells lose
          their '%' formatting artifact); Spend lands canonical as 'cost' in
          the account currency (cost_source_currency).
        columns:
          - name: date
            description: "ISO-8601 date string (TimePeriod, Daily bucket, GMT report time zone). Day grain."
          - name: data_level
            description: >
              Report type that produced this row: CAMPAIGN | AD_GROUP | AD |
              KEYWORD | SEARCH_QUERY | ACCOUNT | GEOGRAPHIC | AGE_GENDER
              (story 3.6 lesson). Part of the grain key so coexisting grains
              never double-count inside one series.
          - name: account_id
            description: "Advertiser account ID (the selected reporting account)."
          - name: campaign_id
            description: "Campaign ID ('' on rows whose grain does not carry it)."
          - name: campaign_name
            description: "Campaign display name."
          - name: ad_group_id
            description: "Ad group ID ('' above ad group grain)."
          - name: ad_group_name
            description: "Ad group display name."
          - name: ad_id
            description: "Ad ID ('' above ad grain)."
          - name: keyword_id
            description: "Keyword ID (keyword grain only)."
          - name: keyword
            description: "Keyword text (keyword / search query grains)."
          - name: search_query
            description: "Search query (search query grain only)."
          - name: segments_json
            description: >
              Canonical sorted-key JSON of the selected non-key SEGMENTING
              dimensions (AgeGroup/Gender, DeviceType, Country/State/City,
              ...). NULL when none were selected. Part of the supersede grain.
          - name: attributes_json
            description: >
              Story 26.6 Part A: canonical sorted-key JSON of the selected
              DESCRIPTIVE-MUTABLE entity status/type attributes
              (campaign_status, ad_status, campaign_type, ...). These MUTATE
              across the refetch ladder re-pulls, so they are kept OUT of the
              supersede grain (latest-wins) -- NEVER in segments_json / the
              QUALIFY partition. NULL when none were selected.
          - name: metric
            description: >
              Canonical metric id (catalog field_id after manifest rename,
              e.g. 'cost' for Spend). Long-format contract.
          - name: value_num
            description: >
              Statistic value coerced by catalog physical_type. Ratio
              statistics selected via catalog_daily are RAW day-grain values:
              NON-ADDITIVE (AD-4), never SUM them.
          - name: cost_source_currency
            description: "Account billing currency (CurrencyCode) when selected; NULL otherwise."
          - name: pull_id
            description: "Prefixed ULID (pull_<ULID>) identifying the load batch. AD-7."
          - name: loaded_at
            description: "UTC ISO-8601 timestamp of when this batch was loaded."
          - name: project_id
            description: "Project binding (AD-14). 'default' for seeded test data."

models:
  - name: stg_microsoft_ads_daily
    description: >
      Staging layer for the Microsoft Ads LONG landing (Story 26.4).
      Supersede semantics (AD-7): QUALIFY keeps only the latest pull per
      grain (project_id, date, data_level, account_id, campaign_id,
      ad_group_id, ad_id, keyword_id, search_query, segments_json, metric) --
      required because conversions/revenue are restated to the CLICK date for
      up to 90 days (refetch ladder 3/30/90). AD-4: ratio statistics land raw
      and are never summed.
    tests:
      # AI-05 grain uniqueness: a duplicate grain row means double-counted
      # KPIs downstream. The QUALIFY dedup must always hold. COALESCE the
      # nullable segments_json so rows without segments key cleanly.
      - unique:
          name: stg_microsoft_ads_daily_grain_unique
          arguments:
            column_name: "project_id || '|' || date || '|' || data_level || '|' || account_id || '|' || campaign_id || '|' || ad_group_id || '|' || ad_id || '|' || keyword_id || '|' || search_query || '|' || COALESCE(segments_json, '') || '|' || metric"
    columns:
      - name: date
        description: "ISO-8601 date string. Day grain."
        tests:
          - not_null
      - name: data_level
        description: "Report type marker (part of the grain key)."
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["CAMPAIGN", "AD_GROUP", "AD", "KEYWORD", "SEARCH_QUERY", "ACCOUNT", "GEOGRAPHIC", "AGE_GENDER"]
      - name: account_id
        description: "Advertiser account ID."
        tests:
          - not_null
      - name: attributes_json
        description: >
          Story 26.6 Part A: latest-wins entity status/type attributes, HORS
          the supersede partition (never a grain key). Rides the surviving row.
      - name: metric
        description: "Canonical metric id (long format)."
        tests:
          - not_null
      - name: value_num
        description: "Statistic value (account currency for monetary metrics)."
        tests:
          - not_null
      - name: pull_id
        description: "Provenance ID from raw load batch (AD-7)."
        tests:
          - not_null
      - name: loaded_at
        description: "UTC load timestamp from raw batch."
      - name: project_id
        description: "Project binding for this row. Propagated from raw_microsoft_ads_daily."
        tests:
          - not_null
