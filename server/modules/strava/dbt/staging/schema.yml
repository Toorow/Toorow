version: 2

sources:
  - name: raw_strava
    description: "Immutable raw landing zone for Strava club snapshots (AD-7: append-only)."
    schema: main
    tables:
      - name: raw_strava_club_daily
        description: "Raw Strava club snapshot rows (wide, canonical column names). One row per club per snapshot_date. Append-only (AD-7)."

models:
  - name: stg_strava_club_daily
    description: >
      Staging: Strava club snapshots with canonical names.
      QUALIFY supersede (AD-7): latest pull per grain wins.
      Grain: (project_id, snapshot_date, club_id).
      AD-4: member_count/following_count are non-additive point-in-time levels
      (aggregation_rule=latest); never summed, never emitted into fact_daily_kpi.
    columns:
      - name: snapshot_date
        tests: [not_null]
      - name: club_id
        tests: [not_null]
      - name: pull_id
        tests: [not_null]
    tests:
      - unique:
          name: stg_strava_club_daily_grain_unique
          arguments:
            column_name: "project_id || '|' || snapshot_date || '|' || club_id"

  - name: fact_strava_club_snapshot
    description: >
      Dedicated snapshot mart for Strava club metrics (member_count,
      following_count). NON-ADDITIVE point-in-time levels -- never summed across
      dates/clubs; growth derived downstream. Separate from the additive
      fact_daily_kpi by design (GSC average_position precedent).
    columns:
      - name: snapshot_date
        tests: [not_null]
      - name: club_id
        tests: [not_null]
      - name: pull_id
        tests: [not_null]
    tests:
      - unique:
          name: fact_strava_club_snapshot_grain_unique
          arguments:
            column_name: "project_id || '|' || snapshot_date || '|' || club_id"
