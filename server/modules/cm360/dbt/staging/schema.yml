version: 2

sources:
  - name: raw_cm360
    description: "Append-only full-grain Campaign Manager 360 landing."
    schema: "{{ var('raw_schema', 'main') }}"  # 24.4 AC2: org_<wslug>_raw injected by orchestrator, 'main' without var (bit-identique)
    tables:
      - name: raw_cm360_daily

models:
  - name: stg_cm360_daily
    description: "CM360 full-grain staging; latest pull wins only at the complete selected grain."
    columns:
      - name: report_profile
        tests: [not_null]
      - name: profile_id
        tests: [not_null]
      - name: advertiser_id
        tests: [not_null]
      - name: metric
        tests: [not_null]
      - name: provider_value
        tests: [not_null]
      - name: country_source
        description: "Raw CM360 country name or provider sentinel before normalization."
      - name: country
        description: "Canonical ISO 3166-1 alpha-2 code; unresolved source values stay NULL."
      - name: pull_id
        tests: [not_null]
      - name: project_id
        tests: [not_null]
    tests:
      - unique:
          name: stg_cm360_full_grain_unique
          arguments:
            column_name: "project_id || '|' || report_profile || '|' || profile_id || '|' || advertiser_id || '|' || COALESCE(date, '') || '|' || COALESCE(campaign_id, '') || '|' || COALESCE(placement_id, '') || '|' || COALESCE(creative_id, '') || '|' || COALESCE(floodlight_activity_id, '') || '|' || dimensions_json || '|' || metric"
