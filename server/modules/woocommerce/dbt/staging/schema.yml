version: 2

sources:
  - name: raw_woocommerce
    description: "Immutable raw landing zone for WooCommerce orders (AD-7: append-only)."
    schema: main  # DuckDB default schema; BigQuery: override via profiles.yml dataset
    tables:
      - name: raw_woocommerce_orders
        description: >
          Raw WooCommerce orders — one row per order × pull_id. Append-only (AD-7).
          Only sale-of-record statuses (completed, processing) are landed.
          transaction_id is a DETAIL dimension (GA4 × WooCommerce join key, Epic 17),
          not the grain key; often empty on manual payments.
        columns:
          - name: date
            description: "ISO-8601 date string (order date_created day). Day grain."
          - name: order_id
            description: "WooCommerce order id. Supersede grain key with (project_id, date)."
          - name: transaction_id
            description: >
              Payment-gateway transaction id. GA4 × WooCommerce reconciliation key
              (Epic 17). Nullable — often empty on manual/offline payments; the
              presence quality test measures the real coverage.
          - name: revenue
            description: "Order total (source currency) from order.total. Additive (AD-4)."
          - name: refund_amount
            description: >
              Refund total for the order (source currency), DEDICATED positive column
              (abs sum of refunds[].total). NEVER subtracted silently from revenue
              (decision REFERENCE shopify 15.4 / stripe 15.7). Additive (AD-4).
          - name: orders_count
            description: "1 per order; summed to a daily order count in the mart. Additive (AD-4)."
          - name: revenue_source_currency
            description: "Order currency (e.g. 'EUR', 'USD'). Enables FX normalization in staging."
          - name: pull_id
            description: "Prefixed ULID (pull_<ULID>) identifying the load batch. AD-7."
          - name: loaded_at
            description: "UTC ISO-8601 timestamp of when this batch was loaded."
          - name: project_id
            description: "Project binding. 'default' for seeded test data; real project IDs otherwise (AD-14)."

models:
  - name: stg_woocommerce_orders_daily
    description: >
      Staging layer: maps raw WooCommerce order fields to canonical names. AD-4: only
      additive metrics (revenue, refund_amount, orders_count). Supersede semantics
      (AD-7): QUALIFY keeps the latest pull per (project_id, date, order_id). Currency:
      revenue / refund_amount are FX-normalized to the project canonical currency (EUR
      by default) via fx_rates; source values preserved. refund_amount is a DEDICATED
      positive column — never netted into revenue.
    tests:
      # Grain uniqueness (AI-05): one row per project × date × order.
      - unique:
          name: stg_woocommerce_orders_grain_unique
          arguments:
            column_name: "project_id || '|' || date || '|' || order_id"
    columns:
      - name: date
        description: "ISO-8601 date string, order date_created day."
        tests:
          - not_null
      - name: order_id
        description: "WooCommerce order id (grain key with project_id + date)."
        tests:
          - not_null
      - name: transaction_id
        description: >
          Payment transaction id (GA4 × WooCommerce join key, Epic 17). Nullable —
          often empty on manual payments.
      - name: revenue
        description: "Order total normalized to project currency (additive, AD-4)."
        tests:
          - not_null
      - name: refund_amount
        description: >
          Refund total normalized to project currency — DEDICATED positive column,
          never netted into revenue. Additive (AD-4).
        tests:
          - not_null
      - name: orders_count
        description: "1 per order; summed to a daily count in the mart (additive, AD-4)."
        tests:
          - not_null
      - name: revenue_source_value
        description: "Raw order total in the order currency (AD-6: preserved for reconciliation)."
        tests:
          - not_null
      - name: revenue_source_currency
        description: "The currency of the raw order amount (e.g. 'EUR')."
        tests:
          - not_null
      - name: pull_id
        description: "Provenance ID from raw load batch (AD-7)."
        tests:
          - not_null
      - name: loaded_at
        description: "UTC load timestamp from raw batch."
      - name: project_id
        description: "Project binding propagated from raw_woocommerce_orders."
        tests:
          - not_null
