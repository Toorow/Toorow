# Cloud Build config to build the toorow server image from the repo-root context
# using the mcp-server Dockerfile. Used to stand up the inbound-receipt /
# inbound-bridge Cloud Run services from the Epic 38 branch.
#
#   gcloud builds submit --project toorow \
#     --config infra/docker/mcp-server/cloudbuild.yaml \
#     --substitutions=_IMG=europe-west1-docker.pkg.dev/toorow/cloud-run-source-deploy/inbound:epic38 .
steps:
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - -f
      - infra/docker/mcp-server/Dockerfile
      - -t
      - ${_IMG}
      - .
images:
  - ${_IMG}
options:
  machineType: E2_HIGHCPU_8
