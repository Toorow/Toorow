name: Nightly / Release

# Deux verifications d'infrastructure jouees a cadence de release : la boucle
# dbt (seed -> run -> test) et la suite d'isolation sur un Postgres ephemere
# avec toutes les migrations rejouees dans l'ordre. C'est tout.
#
# CE QUE CE WORKFLOW NE FAIT PAS, ET NE DOIT PAS REFAIRE :
#
#   1. Tester les connecteurs. Decision Jean, 2026-07-26 : la conformance
#      connecteur ne tourne PAS dans git, ni par PR ni la nuit. Elle se joue
#      pendant le dev et en local. Le harnais reste dans le depot :
#        uv run pytest server/tests/conformance/ --module-path server/modules/<connecteur>/
#      La matrice qui l'executait ici ouvrait un job par connecteur (~35).
#
#   2. Lancer la suite pytest complete. Un job `full-python` le faisait
#      (`uv run pytest server/tests`) et tournait 95 MINUTES sans finir. Les
#      suites backend, offline comme pg-gated, se rejouent EN LOCAL avec la
#      stack Docker avant deploiement :
#        docker compose --env-file infra/nango/.env -f infra/nango/docker-compose.yml up -d
#        uv run pytest server/tests -q
#
# Le depot est PRIVE : les minutes de runner se paient, et c'est le temps
# cumule qui compte, pas le mur d'horloge. Avant ce menage le nightly finissait
# en 2 minutes en brulant 42 minutes de runner.

on:
  schedule:
    - cron: "0 3 * * *" # 03:00 UTC daily
  release:
    types: [published]
  workflow_dispatch:

jobs:
  # ---------------------------------------------------------------------------
  # Full dbt loop (seed → load → run → test).
  # ---------------------------------------------------------------------------
  full-dbt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          # Evite de reinstaller tout l'environnement a chaque execution.
          enable-cache: true

      - name: Sync Python deps
        run: uv sync --frozen --all-packages

      - name: Generate + load GA4 seed into DuckDB
        run: |
          uv run python server/modules/google-analytics/seeds/generate_seed.py
          uv run python server/modules/google-analytics/seeds/load_seed.py \
            --mode duckdb --duckdb-path /tmp/ci_test.duckdb

      - name: Write dbt profiles.yml (DuckDB local)
        run: |
          mkdir -p dbt/profiles
          cat > dbt/profiles/profiles.yml <<'PROFILES'
          connector:
            target: local
            outputs:
              local:
                type: duckdb
                path: /tmp/ci_test.duckdb
                threads: 1
          PROFILES

      # Meme correctif que le job dbt-test de ci.yml. `dbt seed` manquait alors
      # que le staging ref() les dimensions de reference, et le `dbt run` etait
      # nu: il tentait les 66 modeles sur un entrepot ne contenant que le seed
      # GA4, soit 38 erreurs et 0 modele reussi a chaque nuit.
      #
      # DETTE ASSUMEE, et c est la seule raison pour laquelle ce job "full" est
      # ici aussi etroit que celui de la CI: construire le DAG complet demande
      # un squelette des 53 sources (les raw_* de 24 modules plus le schema
      # mirror) qu aucun workflow ne provisionne. Tant qu il n existe pas, un
      # nightly "exhaustif" sur dbt est un mensonge -- mieux vaut un smoke vrai.
      - name: dbt seed + run + test (staging google_analytics)
        env:
          TOOROW_DUCKDB_PATH: /tmp/ci_test.duckdb
        run: |
          cd dbt
          uv run dbt seed --profiles-dir profiles
          uv run dbt run --profiles-dir profiles --select stg_ga4_standard_daily
          uv run dbt test --profiles-dir profiles --select stg_ga4_standard_daily

  # ---------------------------------------------------------------------------
  # Isolation suite (ephemeral Postgres, all migrations).
  # ---------------------------------------------------------------------------
  full-isolation:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: connector
          POSTGRES_PASSWORD: connector_dev_only
          POSTGRES_DB: connector
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      TEST_POSTGRES_DSN: postgresql://connector:connector_dev_only@localhost:5432/connector
      PLATFORM_DB_URL: postgresql://connector:connector_dev_only@localhost:5432/connector
      HEALTH_POLLER_ENABLED: "false"
      QUEUE_WORKER_ENABLED: "false"
      SCHEDULER_ENABLED: "false"
      TOOROW_AUTH_MODE: disabled
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          # Evite de reinstaller tout l'environnement a chaque execution.
          enable-cache: true

      # --all-packages : la racine ne declare aucune dependance, les libs de run
      # (jsonschema, ...) vivent dans server/pyproject.toml. Sans ce flag pytest
      # casse a la collecte sur ModuleNotFoundError. Meme correctif que ci.yml.
      - name: Sync deps
        run: uv sync --frozen --all-packages

      - name: Apply app-schema migrations in order
        run: uv run python scripts/apply_migrations.py

      - name: Verify migration ledger is complete
        run: uv run python scripts/apply_migrations.py --verify-complete

      - name: Verify migration upgrade preserves tenant data
        run: uv run python scripts/verify_migration_upgrade.py

      - name: Run isolation suite
        run: uv run pytest server/tests/isolation/ -v -m isolation
