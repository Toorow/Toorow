name: CI

# CI de PR : un job `changes` (filtre par chemin) conditionne chaque job aval,
# pour qu'une PR backend ne rebuild pas les widgets et qu'une PR UI ne lance pas
# dbt. Sur push `main`, toutes les portes s'ouvrent (run complet post-merge).
#
# Ce que la CI NE fait PAS : tester les connecteurs, ni lancer les suites pytest
# backend. Decision Jean, 2026-07-26 pour la conformance connecteur -- elle se
# joue pendant le dev et en local, jamais dans git :
#   uv run pytest server/tests/conformance/ --module-path server/modules/<connecteur>/
# Le job `conformance` qui la portait ici a ete retire ; seul le controle de
# fraicheur du registre genere reste, dans le job `python` (c'est un artefact
# commite consomme par la vitrine, pas un test de connecteur).
#
# Depot PRIVE : les minutes de runner se paient. Raisonner en temps cumule.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # ---------------------------------------------------------------------------
  # Path filter — decides which downstream jobs are relevant for this change.
  # ---------------------------------------------------------------------------
  changes:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      # `connectors` reste expose bien qu'aucun job ne le consomme depuis le
      # retrait de la conformance : le filtre est le point d'entree naturel si
      # un jour un job doit reagir a un changement de connecteur.
      connectors: ${{ steps.filter.outputs.connectors }}
      ui: ${{ steps.filter.outputs.ui }}
      vitrine: ${{ steps.filter.outputs.vitrine }}
      dbt: ${{ steps.filter.outputs.dbt }}
      infra: ${{ steps.filter.outputs.infra }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'server/**'
              - 'pyproject.toml'
              - 'uv.lock'
              - 'dbt/**'
              - 'infra/nango/migrations/**'
              - 'scripts/apply_migrations.py'
              - 'scripts/check_migration_catalog.py'
              - 'scripts/verify_migration_upgrade.py'
              - 'scripts/run_evals.py'
              - 'scripts/eval_gate.py'
              - '.github/workflows/ci.yml'
              - '.github/workflows/nightly.yml'
            connectors:
              - 'server/modules/**'
            ui:
              - 'ui/**'
            vitrine:
              - 'web/**'
              - 'studio/**'
              - 'docs/**'
            dbt:
              - 'dbt/**'
              - 'server/modules/**/seeds/**'
            infra:
              - 'infra/**'

  # ---------------------------------------------------------------------------
  # Always-on cheap guards: source-agnostic core (AD-2), secrets, narrative.
  # These are fast and protect invariants regardless of what changed.
  # ---------------------------------------------------------------------------
  guards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Lint — assert core/ is source-agnostic (AC5 / AD-2 / T8.2)
        run: make check-core-source-agnostic

      - name: AD-1 guard — narrative.py must not import warehouse or read raw rows (Story 6.4, AC8)
        run: make check-narrative-no-raw

      # Three guards that existed as Makefile targets and were called by nothing.
      # They are pure greps and one CSV/SQL read — no service, no database, no
      # pytest suite, so they respect the standing decision that backend suites
      # do NOT run here (see the header of this file and of nightly.yml).
      - name: AD-4 guard — average_position is never summed in a mart (Story 6.2)
        run: make check-non-additive-guard

      - name: Epic 66 guard — a ratio's formula says the same thing in the seed and in its mart
        run: make check-metric-formula-parity

      - name: Epic 66 guard — a common key version is immutable, with one writer
        run: make check-mdm-invariants

      # The ratchet, not a wall: it refuses a NEW canonical target that nobody
      # classified, and refuses a line that is listed after being fixed. What is
      # not classified cannot be understood or automated — a field nobody typed
      # is summed by whatever reads it first.
      - name: AI-288 ratchet — a canonical target is classified, or it is refused
        run: make check-canonical-classification

      # Same shape, different subject: `admin_api.py` went 21 727 -> 2 886 lines
      # and every `path:line` citation into it stopped meaning anything, silently.
      # Three reviews REJECTED on a stale citation before this existed. A pure
      # file read — no service, no database, no pytest.
      - name: AI-250 ratchet — no NEW line citation into a decomposed file
        run: make check-decomposed-citations

      - name: Secret grep gate — assert no secret assignments in source (Story 2.1 T5.1)
        run: |
          if grep -rE "(SECRET|PASSWORD|TOKEN|KEY)\s*=" server/ infra/ .github/ \
            --include="*.py" --include="*.tf" --include="*.yml" --include="*.yaml" \
            --include="*.json" \
            | grep -vE ":\s*#" \
            | grep -v "description\s*=" \
            | grep -v "\-\-set-secrets"; then
            echo "FAIL: possible secret assignment found in tracked files"
            exit 1
          fi
          echo "OK: no secret assignments detected"

  # ---------------------------------------------------------------------------
  # Python: version assertion, lint, tests. Backend-scoped.
  # ---------------------------------------------------------------------------
  python:
    needs: changes
    if: needs.changes.outputs.backend == 'true' || github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          # Evite de reinstaller tout l'environnement a chaque execution.
          enable-cache: true

      - name: Assert Python 3.12
        run: |
          uv run python --version
          uv run python --version | grep -q "3.12" || (echo "Python 3.12 required" && exit 1)

      # --all-packages : le contrôle du registre importe jsonschema, referencing
      # et core.*, qui vivent dans server/pyproject.toml et pas à la racine.
      - name: Sync deps (resolves uv.lock — asserts fastmcp 3.4.x, dbt-core 1.11.x)
        run: uv sync --frozen --all-packages

      - name: Lint (ruff)
        run: uv run ruff check server

      # AD-42 bounds the CONNECTOR catalog (zero provider-named tools); this
      # bounds the CORE one (113 assembled / 48 wire when the bound landed,
      # after +15 tools in 8 days unbounded). Raising a budget in the script is
      # a stated decision, never a silent drift (audit 2026-08-20, C14).
      - name: MCP catalog growth bound — the core surface stays under budget
        run: uv run python scripts/mcp_tool_surface_report.py --gate

      # CAP-16 exception to the no-backend-suite rule: three pure, service-free
      # contract tests over the canonical 50-question corpus and shared scorers.
      - name: Golden Questions contract (CAP-16)
        run: uv run pytest server/tests/evals/test_golden_questions.py -q

      # Second exception (audit 2026-08-20, C11): the ~39 unmounted connector
      # tools (AD-42) were exercised ONLY out of CI, so an AD-1 envelope drift
      # on them had no green witness. This layer is stub-based (no Postgres, no
      # service, ~3 s) and validates every connector tool against the envelope
      # schema -- it runs here, the heavier conformance layers stay local.
      - name: Connector envelope contract (AD-1, stub-based)
        run: uv run pytest server/tests/conformance/test_envelope.py -q

      - name: Validate migration catalog
        run: uv run python scripts/check_migration_catalog.py

      # Cohérence d'artefact généré, PAS un test de connecteur : ce fichier est
      # commité et sert la vitrine. Quand il n'est pas régénéré après un changement
      # de manifest, la vitrine casse en aval sur un décompte faux (arrivé le
      # 2026-07-25 : 125 profils commités contre 128 attendus). Le contrôle portait
      # jusqu'ici dans la suite de conformance ; celle-ci a quitté la CI, pas lui.
      # ~2 s.
      - name: Registre connecteurs à jour (artefact généré)
        run: |
          uv run python scripts/export_connector_registry.py \
            --check web/src/generated/connector-registry.json

      # NOTE : les suites pytest (core, modules, conformance des connecteurs,
      # evals, integration, gate P1) ne tournent PAS en CI -- décision Jean,
      # 2026-07-26 pour la conformance connecteur. Elles demandent les services
      # Docker (Postgres/Nango) et sont trop lourdes pour des runners hébergés
      # sur un projet de cette taille. Elles se rejouent en local, pendant le dev
      # et avant déploiement, la stack up :
      #   docker compose --env-file infra/nango/.env -f infra/nango/docker-compose.yml up -d
      #   uv run pytest server/tests -q
      #   uv run pytest server/tests/conformance/ --module-path server/modules/<connecteur>/
      # La CI ne garde que les contrôles statiques rapides et sans service.

  # ---------------------------------------------------------------------------
  # Tokens + Shell: design token build and TypeScript type-check (Story 1.2).
  # UI-scoped (needed as a peer for every UI job below).
  # ---------------------------------------------------------------------------
  tokens-and-shell:
    needs: changes
    if: needs.changes.outputs.ui == 'true' || github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: ui/pnpm-lock.yaml

      - name: Install UI deps
        run: pnpm -C ui install --frozen-lockfile

      - name: Bundle checker fixture tests
        run: pnpm -C ui test:bundle-check

      - name: Build design tokens (Style Dictionary → dist/theme.ts)
        run: pnpm -C ui build:tokens

      - name: TypeScript type-check @toorow/shell
        run: pnpm --filter @toorow/shell run typecheck
        working-directory: ui

  # ---------------------------------------------------------------------------
  # GA4 widget unit tests — Vitest + React Testing Library (Story 1.7, T8.4).
  # ---------------------------------------------------------------------------
  widget-tests:
    needs: [changes, tokens-and-shell]
    if: needs.changes.outputs.ui == 'true' || github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: ui/pnpm-lock.yaml

      - name: Install UI deps
        run: pnpm -C ui install --frozen-lockfile

      - name: Build design tokens (required by @toorow/shell peer)
        run: pnpm -C ui build:tokens

      - name: Run GA4 widget tests (Vitest)
        run: pnpm --filter @toorow/widget-google-analytics test
        working-directory: ui

  # ---------------------------------------------------------------------------
  # Card library tests — shell primitives + the card widgets (Epic 9).
  # ---------------------------------------------------------------------------
  card-tests:
    needs: [changes, tokens-and-shell]
    if: needs.changes.outputs.ui == 'true' || github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: ui/pnpm-lock.yaml

      - name: Install UI deps
        run: pnpm -C ui install --frozen-lockfile

      - name: Build design tokens (required by @toorow/card-shell)
        run: pnpm -C ui build:tokens

      - name: Run card package tests (Vitest)
        run: |
          for pkg in card-shell card-kpi card-keywords card-conversions card-usertypes card-journey card-connectors; do
            pnpm --filter @toorow/$pkg test
          done
        working-directory: ui

  # ---------------------------------------------------------------------------
  # Widget build + AD-11 / NFR4 bundle gate (T5). UI-scoped.
  # ---------------------------------------------------------------------------
  bundle-check:
    needs: [changes, tokens-and-shell]
    if: needs.changes.outputs.ui == 'true' || github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: ui/pnpm-lock.yaml

      - name: Assert pinned JS stack (react/mui/vite/singlefile)
        run: |
          node -e "const p=require('path'); \
            const d=require(p.join(process.env.GITHUB_WORKSPACE, 'ui/widgets/sample/package.json')); \
            const all={...d.dependencies,...d.devDependencies}; \
            const need={react:'^19.2.0','@mui/material':'^9.0.0',vite:'^8.0.0','vite-plugin-singlefile':'2.3.3'}; \
            for (const [k,v] of Object.entries(need)) { \
              if (all[k]!==v) { console.error('Pin mismatch',k,all[k],'expected',v); process.exit(1);} } \
            console.log('JS stack pins OK');"

      - name: Install UI deps
        run: pnpm -C ui install --frozen-lockfile

      - name: Build design tokens (Style Dictionary → dist/theme.ts)
        run: pnpm -C ui build:tokens

      - name: Build sample widget (single-file)
        run: pnpm -C ui --filter @toorow/widget-sample build

      - name: Bundle gate — sample widget (regression guard, Story 1.6 AC10)
        run: node ui/scripts/bundle-check.mjs ui/widgets/sample/dist/index.html

      - name: Build google-analytics widget — signature heatmap (Story 1.6)
        run: pnpm -C ui --filter @toorow/widget-google-analytics build

      - name: Bundle gate — google-analytics widget (NFR4 / AD-11 / Story 1.6 AC6)
        run: node ui/scripts/bundle-check.mjs ui/widgets/google-analytics/dist/index.html

      - name: Assert google-analytics widget bundle < 1.5 MB uncompressed (Story 1.6 AC7)
        run: |
          SIZE=$(wc -c < ui/widgets/google-analytics/dist/index.html)
          echo "google-analytics widget bundle: ${SIZE} bytes uncompressed"
          if [ "$SIZE" -ge 1572864 ]; then
            echo "FAIL: bundle ${SIZE} bytes >= 1.5 MB (1572864) — font subsetting regression (AC7)"
            exit 1
          fi

      - name: Build project-capability-impact widget (Epic 39 — capability impact app)
        run: pnpm -C ui --filter @toorow/widget-project-capability-impact build

      # SANS --max-bytes, et c'est deliberé : ce bundle mesure 5 242 457 octets
      #   wc -c < ui/widgets/project-capability-impact/dist/index.html
      # soit 3,3x le budget de 1,5 Mo de l'AC7 -- mais l'AC7 a été ratifié pour
      # le widget google-analytics (story 1.6) puis étendu à la famille
      # `ui/cards/*`, jamais à ce widget-ci, et aucun document ne lui fixe de
      # budget. Poser un seuil inventé ici rendrait la CI rouge sur une décision
      # que personne n'a prise ; l'omettre laisserait croire que la taille est
      # jugée. AD-11 (aucune référence externe) est gardé dès maintenant ; le
      # budget de taille est un manque nommé, pas un oubli.
      - name: Bundle gate — project-capability-impact widget (AD-11 / NFR4, no size budget ratified)
        run: node ui/scripts/bundle-check.mjs ui/widgets/project-capability-impact/dist/index.html

      # AI-107(b) : le runtime de visualisation partage est l'artefact qu'AD-11
      # nomme en toutes lettres (« the shared Visualization runtime compiles for
      # MCP Apps to one self-contained HTML resource »), et c'est celui que
      # rendent REELLEMENT les 26 connecteurs -- tous declarent
      # `widget_ref: ui://core/daily-report`, resolu vers
      # `ui://core/visualization-runtime` par la story 50.6. Il n'etait ni
      # construit ni controle ici : la seule regle du depot qui interdit a un
      # widget de parler a quelqu'un ne s'appliquait a aucun des 26.
      - name: Build shared Visualization runtime (Story 50.5 — @toorow/card-shell)
        run: pnpm -C ui --filter @toorow/card-shell build

      - name: Bundle gate — shared Visualization runtime, MCP App + Share (AD-11 / NFR4)
        run: |
          node ui/scripts/bundle-check.mjs ui/cards/shell/dist/viz/mcp-app.html --max-bytes 1500000
          node ui/scripts/bundle-check.mjs ui/cards/shell/dist/viz/share.html --max-bytes 1500000

      # `attribution`, `dedup` et `mediaplan-pacing` manquaient a cette liste :
      # construits, livres, et jamais passes a la garde (AI-107(b)).
      - name: Build + bundle gate — card widgets (Epic 9, AD-11; review-9-2b F-2)
        run: |
          for pkg in kpi keywords conversions usertypes journey connectors attribution dedup mediaplan-pacing; do
            pnpm -C ui --filter @toorow/card-$pkg build
            node ui/scripts/bundle-check.mjs ui/cards/$pkg/dist/index.html --max-bytes 1500000
          done
          echo "OK: under the 1.5 MB AC7 budget"

  # ---------------------------------------------------------------------------
  # Admin console: build + bundle-check + Vitest (Story 2.4). UI-scoped.
  # ---------------------------------------------------------------------------
  admin-console:
    needs: [changes, tokens-and-shell]
    if: needs.changes.outputs.ui == 'true' || github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: ui/pnpm-lock.yaml

      - name: Install UI deps
        run: pnpm -C ui install --frozen-lockfile

      - name: Build design tokens (required by @toorow/shell peer)
        run: pnpm -C ui build:tokens

      - name: Build admin console (Story 2.4, AC1, AC6)
        run: pnpm --filter @toorow/admin build
        working-directory: ui

      - name: Bundle gate -- complete admin artifact, URLs + 6 MB raw budget
        run: node ui/scripts/bundle-check.mjs ui/admin/dist --max-bytes 6000000

      - name: Admin console Vitest tests (Story 2.4, AC8)
        run: pnpm --filter @toorow/admin test
        working-directory: ui

  # ---------------------------------------------------------------------------
  # dbt seed loop: generate → load (DuckDB) → dbt run → dbt test (Story 1.4).
  # dbt/connector/backend-scoped.
  # ---------------------------------------------------------------------------
  dbt-test:
    needs: changes
    if: needs.changes.outputs.dbt == 'true' || needs.changes.outputs.backend == 'true' || github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          # Evite de reinstaller tout l'environnement a chaque execution.
          enable-cache: true

      - name: Sync Python deps (dbt-core 1.11, dbt-duckdb, duckdb, python-ulid)
        run: uv sync --frozen --all-packages

      - name: Generate GA4 seed CSV (90 days × 1350 rows)
        run: uv run python server/modules/google-analytics/seeds/generate_seed.py

      - name: Load seed into local DuckDB (mints pull_id)
        run: |
          uv run python server/modules/google-analytics/seeds/load_seed.py \
            --mode duckdb \
            --duckdb-path /tmp/ci_test.duckdb

      - name: Write dbt profiles.yml for DuckDB (local target)
        run: |
          mkdir -p dbt/profiles
          cat > dbt/profiles/profiles.yml <<'PROFILES'
          connector:
            target: local
            outputs:
              local:
                type: duckdb
                path: /tmp/ci_test.duckdb
                threads: 1
          PROFILES

      # Les seeds (dim_device, dim_country, dim_metric, ...) sont des dependances
      # DUES du staging : normalize_dimension les ref(). Sans cette etape le
      # premier modele echouait sur "Table with name dim_device does not exist".
      - name: dbt seed — dimensions de reference
        run: |
          cd dbt
          uv run dbt seed --profiles-dir profiles
        env:
          TOOROW_DUCKDB_PATH: /tmp/ci_test.duckdb

      # --select explicite, contrairement a ce que le nom de l etape promettait
      # jusqu ici : la commande etait un `dbt run` nu qui construisait les 66
      # modeles sur un entrepot ne contenant QUE le seed GA4, donc 38 erreurs a
      # chaque execution. Les marts unissent tous les connecteurs et le DAG
      # complet demande un squelette des 53 sources (raw_* de 24 modules +
      # schema mirror) que la CI ne provisionne pas. Ce que ce job prouve
      # reellement, et qui a de la valeur : le chargeur de seed, les seeds, les
      # macros de normalisation et le contrat du staging GA4 -- c est ce qui a
      # rattrape la derive report_timezone. Le build dbt complet reste un gate
      # LOCAL sur donnees reelles, pas un gate CI.
      - name: dbt run — staging google_analytics (seul lignage seede)
        run: |
          cd dbt
          uv run dbt run --profiles-dir profiles --select stg_ga4_standard_daily
        env:
          TOOROW_DUCKDB_PATH: /tmp/ci_test.duckdb

      - name: dbt test — data quality gates (AC6)
        run: |
          cd dbt
          uv run dbt test --profiles-dir profiles --select stg_ga4_standard_daily
        env:
          TOOROW_DUCKDB_PATH: /tmp/ci_test.duckdb

  # ---------------------------------------------------------------------------
  # Cross-project isolation suite (Story 7.4 — permanent gate, FR12/AD-5).
  # Backend/migration-scoped.
  # ---------------------------------------------------------------------------
  isolation:
    needs: changes
    if: needs.changes.outputs.backend == 'true' || github.event_name == 'push'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: connector
          POSTGRES_PASSWORD: connector_dev_only
          POSTGRES_DB: connector
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      TEST_POSTGRES_DSN: postgresql://connector:connector_dev_only@localhost:5432/connector
      PLATFORM_DB_URL: postgresql://connector:connector_dev_only@localhost:5432/connector
      HEALTH_POLLER_ENABLED: "false"
      QUEUE_WORKER_ENABLED: "false"
      SCHEDULER_ENABLED: "false"
      TOOROW_AUTH_MODE: disabled
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          # Evite de reinstaller tout l'environnement a chaque execution.
          enable-cache: true

      # --all-packages : idem conformance, la suite isolation lance pytest.
      - name: Sync deps
        run: uv sync --frozen --all-packages

      - name: Apply app-schema migrations in order
        run: uv run python scripts/apply_migrations.py

      - name: Verify migration ledger is complete
        run: uv run python scripts/apply_migrations.py --verify-complete

      - name: Verify migration upgrade preserves tenant data
        run: uv run python scripts/verify_migration_upgrade.py

      - name: Run isolation suite (HARD GATE — a failure blocks merge)
        run: uv run pytest server/tests/isolation/ -v -m isolation

  # ---------------------------------------------------------------------------
  # Vitrine (marketing site) — build gate, only when web/ changes.
  # The marketing site is owned by a separate track; a full extraction to its
  # own repo is Phase 2. Until then this keeps its build honest without
  # coupling to the product jobs.
  # ---------------------------------------------------------------------------
  vitrine:
    needs: changes
    # `|| push` comme tous les autres jobs filtres: l en-tete de ce fichier
    # promet que sur main toutes les portes s ouvrent, et vitrine etait le seul
    # a ne pas porter la clause. Il restait donc skipped post-merge -- c est
    # ainsi qu un decompte de profils faux (125 != 128) a pu atterrir sur main
    # sans que rien ne le voie.
    if: needs.changes.outputs.vitrine == 'true' || github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Fast, service-free gate only: type-check + JS unit tests (`npm run check`).
      # The full `astro build` is intentionally NOT run here — its prebuild needs
      # uv/Python (connector registry) and its postbuild needs live Sanity
      # content. Build + content tests are run locally / at deploy time.
      - name: Install + type-check + unit-test marketing site
        working-directory: web
        run: |
          if [ -f package.json ]; then
            corepack enable || true
            (pnpm install --frozen-lockfile || npm ci || npm install)
            if npm run | grep -qE '^\s*check'; then
              (pnpm run check || npm run check)
            else
              echo "No check script in web/package.json; skipping."
            fi
          else
            echo "No web/package.json; nothing to check."
          fi

  # ---------------------------------------------------------------------------
  # Terraform validate only — apply is human-gated. Infra-scoped.
  # ---------------------------------------------------------------------------
  terraform:
    needs: changes
    if: needs.changes.outputs.infra == 'true' || github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3

      - name: Terraform fmt check
        run: terraform -chdir=infra/terraform fmt -check

      - name: Terraform init (no backend) + validate
        run: |
          terraform -chdir=infra/terraform init -backend=false
          terraform -chdir=infra/terraform validate
