schema_version = 1

# The public application is an allow-listed projection of the private monorepo.
# Paths not listed here never enter an export, even when they are tracked by Git.
root_files = [
  ".dockerignore",
  ".env.example",
  ".gitattributes",
  ".gitignore",
  "CHANGELOG.md",
  "CONTRIBUTING.md",
  "LICENSE",
  "Makefile",
  "README.md",
  "pyproject.toml",
  "uv.lock",
]

public_directories = [
  ".github",
  "dbt",
  "distribution",
  "docs",
  "infra",
  "scripts",
  "server",
  "ui",
]

# These paths belong to the private product/presence repository. Keeping this
# list explicit makes boundary reviews understandable even though the exporter
# already denies every path not present in the public allow-list.
private_paths = [
  ".agents",
  ".claude",
  ".codex",
  ".design-sync",
  ".ds-sync",
  ".mcp.json",
  "_bmad",
  "_bmad-output",
  "_screenshots",
  "design-sync.config.json",
  "doc",
  "info.md",
  "logo",
  "reviews",
  "skills-lock.json",
  "studio",
  "web",
]

# Defense in depth for generated files, local state, and credentials that may
# accidentally become visible or tracked below an otherwise public directory.
exclude_globs = [
  "**/.env",
  "**/.env.*",
  "**/.pytest_cache/**",
  "**/.ruff_cache/**",
  "**/.terraform/**",
  "**/__pycache__/**",
  "**/*.duckdb",
  "**/*.key",
  "**/*.pem",
  "**/*.p12",
  "**/*.pfx",
  "**/*.pyc",
  "**/*.tfstate",
  "**/*.tfstate.*",
  "**/*.tfvars",
  "**/build/**",
  "**/coverage/**",
  "**/dist/**",
  "**/node_modules/**",
  "**/scratch_*",
  "dbt/profiles/profiles.yml",
  "infra/keys/**",
  # `docs/` est publie parce que docs.toorow.com EST ce dossier : Mintlify lit
  # `docs/` sur main du depot PUBLIC. Mais tout ce qui vit sous `docs/` n en fait
  # pas partie. Mesure du 2026-09-06, sur la premiere projection depuis le
  # 2026-07-26 : elle emportait 43 documents jamais publies -- 38 documents
  # d architecture ratifiee portant des arbitrages nominatifs, un registre de
  # dette, un registre de caveats, et cinq notes de travail internes. Un push
  # public est irreversible (historique, forks, caches) : ce qui n a jamais ete
  # publie ne le devient pas par effet de bord. La page publiee correspondante
  # est `docs/repository-boundary.mdx`, dont la ligne `docs/` = prive contredit
  # ce fichier depuis que Mintlify sert `docs/` -- arbitrage ouvert (AI-372).
  "docs/product-architecture/**",
  "docs/claude-md-incidents.md",
  "docs/console-visual-gate-g1-status.md",
  "docs/note_de_suivi_controle.md",
  "docs/ui-architect-guide.md",
  "docs/ui-css-strategy.md",
  "server/modules/**/seeds/*.csv",
]

# Safe templates are deliberately re-included after the deny rules above.
allow_globs = [
  ".env.example",
  "**/.env.example",
  "**/*.tfvars.example",
]
